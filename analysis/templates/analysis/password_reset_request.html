{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Recovery | Item Analysis System</title>

    <!-- External Assets -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">

    <style>
        /* These styles ensure consistency with your previous page */
        .login-card {
            border-top: 5px solid #1d4ed8 !important;
            padding: 2.5rem;
            border-radius: 15px;
            background: #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .login-title {
            font-weight: 700;
            color: #1e293b;
        }

        .btn-login {
            background-color: #1d4ed8;
            color: white;
            font-weight: 600;
            padding: 12px;
            border-radius: 8px;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background-color: #1e3a8a;
            color: white;
        }

        .form-control {
            border-radius: 8px;
            padding: 12px;
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>
<body>

    <!-- This div creates the soft blue/white background -->
    <div class="background-overlay"></div>

    <div class="login-wrapper">
        
        <!-- Branding (Matches your other page) -->
        <div class="branding-section text-center mb-4">
            <img src="{% static 'images/logo.png' %}" class="school-logo" alt="Logo">
        </div>

        <!-- The Recovery Card -->
        <div class="login-card">
            <h3 class="login-title text-center">Account Recovery</h3>
            <p class="login-sub text-center text-muted mb-4">Enter your admin username to locate your account.</p>
            
            <form method="POST">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Admin username" required autofocus>
                </div>
                
                <button type="submit" class="btn btn-login w-100">Find Account</button>
            </form>

            <div class="text-center mt-4">
                <a href="{% url 'admin_login' %}" class="text-muted small" style="text-decoration: none;">
                    <i class="fas fa-arrow-left"></i> Back to Login
                </a>
            </div>
        </div>
    </div>

</body>
</html>
