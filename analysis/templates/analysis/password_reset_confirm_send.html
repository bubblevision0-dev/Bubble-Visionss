{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Identity | Item Analysis System</title>

    <!-- Google Fonts & Bootstrap -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- FontAwesome for the Shield Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Link to your existing CSS -->
    <link rel="stylesheet" href="{% static 'css/login.css' %}">

    <style>
        /* Specific Icon Wrapper Styling */
        .shield-icon-wrapper {
            background: #eff6ff;
            color: #1d4ed8;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .login-card {
            border-top: 5px solid #1d4ed8 !important;
            padding: 2.5rem;
            border-radius: 15px;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .btn-login {
            background-color: #1d4ed8;
            color: white;
            font-weight: 600;
            padding: 12px;
            border-radius: 8px;
            border: none;
            transition: 0.3s ease;
        }

        .btn-login:hover {
            background-color: #1e3a8a;
            color: white;
        }
    </style>
</head>
<body>

    <div class="background-overlay"></div>

    <div class="login-wrapper">
        
        <div class="branding-section text-center mb-4">
            <img src="{% static 'images/logo.png' %}" class="school-logo" alt="Logo">
        </div>

        <div class="login-card">
            <div class="shield-icon-wrapper">
                <i class="fas fa-shield-alt" style="font-size: 2.5rem;"></i>
            </div>
            
            <h3 class="login-title text-center">Verify Identity</h3>
            <p class="login-sub text-center mb-4">
                We will send a code to your saved recovery email:<br>
                <span class="badge bg-light text-dark p-2 mt-2" style="font-size: 0.9rem; border: 1px dashed #cbd5e1;">
                    {{ masked_email }}
                </span>
            </p>
            
            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-login w-100">Send Code to Email</button>
            </form>

            <div class="text-center mt-4">
                <a href="{% url 'admin_login' %}" class="text-muted small" style="text-decoration: none;">
                    <i class="fas fa-times me-1"></i> Cancel
                </a>
            </div>
        </div>
    </div>

</body>
</html>
