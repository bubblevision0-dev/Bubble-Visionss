{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Your Account | Item Analysis System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Same Fonts and Bootstrap as Login -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">

    <style>
        /* Shared Input Styles */
        .form-control {
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
        }

        /* Eye icon INSIDE password input */
        .password-field { position: relative; }
        .password-field .form-control { padding-right: 46px; }

        .pw-eye-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            padding: 0;
            margin: 0;
            width: 28px;
            height: 28px;
            display: grid;
            place-items: center;
            cursor: pointer;
            z-index: 10;
            color: #1e3a8a;
            opacity: .9;
        }

        /* Specific Shield Icon for the Security Page */
        .shield-icon-wrapper {
            background: #eff6ff;
            color: #1d4ed8;
            width: 60px;
            height: 60px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 1.5rem;
        }

        /* Accent Top Border */
        .login-card {
            border-top: 5px solid #1d4ed8 !important;
            padding: 2rem;
            border-radius: 15px;
        }

        /* Help Text Styling */
        .help-text {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 6px;
            line-height: 1.4;
        }

        .login-title {
            font-weight: 700;
            color: #1e293b;
        }
    </style>
</head>

<body>

    <div class="background-overlay"></div>

    <div class="login-wrapper">

        <!-- Branding Section -->
        <div class="branding-section">
            <img src="{% static 'images/logo.png' %}" class="school-logo" alt="School Logo">
        </div>

        <div class="login-card">

            <h3 class="login-title text-center">Secure Your Account</h3>
            <p class="login-sub text-center">Update your profile to continue</p>

            <form method="POST">
                {% csrf_token %}

                <!-- Recovery Email Field -->
                <div class="mb-4 text-start">
                    <label for="email" class="form-label">Recovery Email</label>
                    <input type="email" class="form-control" id="email" name="email"
                           placeholder="name@example.com" required autofocus>
                    <p class="help-text">
                        <i class="fas fa-info-circle me-1"></i>
                        Used for account recovery if you forget your password.
                    </p>
                </div>

                <!-- New Password Field -->
                <div class="mb-3 text-start">
                    <label for="new_password" class="form-label">New Password</label>
                    <div class="password-field">
                        <input type="password" class="form-control" id="new_password" name="new_password"
                               placeholder="Enter new password" required>
                        <button type="button" class="pw-eye-btn" onclick="toggleVisibility('new_password', this)">
                            <svg class="pwIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" width="18" height="18">
                                <path d="M2.25 12s3.75-7.5 9.75-7.5 9.75 7.5 9.75 7.5-3.75 7.5-9.75 7.5S2.25 12 2.25 12Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M12 15.75A3.75 3.75 0 1 0 12 8.25a3.75 3.75 0 0 0 0 7.5Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password Field -->
                <div class="mb-4 text-start">
                    <label for="confirm_password" class="form-label">Confirm New Password</label>
                    <div class="password-field">
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                               placeholder="Confirm new password" required>
                        <button type="button" class="pw-eye-btn" onclick="toggleVisibility('confirm_password', this)">
                            <svg class="pwIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" width="18" height="18">
                                <path d="M2.25 12s3.75-7.5 9.75-7.5 9.75 7.5 9.75 7.5-3.75 7.5-9.75 7.5S2.25 12 2.25 12Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M12 15.75A3.75 3.75 0 1 0 12 8.25a3.75 3.75 0 0 0 0 7.5Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-login w-100">Update & Proceed</button>
            </form>
        </div>
    </div>

    <script>
        function toggleVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            const svg = btn.querySelector('.pwIcon');
            
            const EYE = `
                <path d="M2.25 12s3.75-7.5 9.75-7.5 9.75 7.5 9.75 7.5-3.75 7.5-9.75 7.5S2.25 12 2.25 12Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 15.75A3.75 3.75 0 1 0 12 8.25a3.75 3.75 0 0 0 0 7.5Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            `;
            const EYE_SLASH = `
                <path d="M3 3l18 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                <path d="M2.25 12s3.75-7.5 9.75-7.5c6 0 9.75 7.5 9.75 7.5s-3.75 7.5-9.75 7.5S2.25 12 2.25 12Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 15.75A3.75 3.75 0 0 1 8.25 12c0-.9.32-1.73.86-2.38M15.75 12c0 .9-.32 1.73-.86 2.38" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            `;

            if (input.type === 'password') {
                input.type = 'text';
                svg.innerHTML = EYE_SLASH;
            } else {
                input.type = 'password';
                svg.innerHTML = EYE;
            }
        }
    </script>

</body>
</html>
