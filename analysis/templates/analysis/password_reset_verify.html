{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Code | Item Analysis System</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">

    <style>
        .login-card {
            border-top: 5px solid #1d4ed8 !important;
            padding: 2.5rem;
            border-radius: 15px;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .otp-input {
            letter-spacing: 12px; 
            font-size: 2rem; 
            height: 70px;
            text-align: center;
            font-weight: 700;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            color: #1e3a8a;
        }

        .otp-input:focus {
            border-color: #1d4ed8;
            box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.1);
        }

        #timer {
            font-weight: 600;
            color: #dc3545; /* Bootstrap Red */
        }

        .btn-login {
            background-color: #1d4ed8;
            color: white;
            font-weight: 600;
            padding: 12px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn-login:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="background-overlay"></div>

    <div class="login-wrapper">
        <div class="branding-section text-center mb-4">
            <img src="{% static 'images/logo.png' %}" class="school-logo" alt="Logo">
        </div>

        <div class="login-card">
            <h3 class="login-title text-center">Enter Verification Code</h3>
            
            <!-- Timer Display -->
            <p class="login-sub text-center mb-4">
                Code expires in: <span id="timer">05:00</span>
            </p>

            <!-- Django Messages (for Error/Success alerts) -->
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} py-2 text-center small">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
            
            <form method="POST" id="otpForm">
                {% csrf_token %}
                <div class="mb-4">
                    <input type="text" 
                           name="otp_code" 
                           id="otp_input"
                           class="form-control otp-input" 
                           placeholder="000000" 
                           maxlength="6" 
                           pattern="\d{6}" 
                           inputmode="numeric"
                           required 
                           autofocus>
                </div>
                
                <button type="submit" id="verifyBtn" class="btn btn-login w-100">Verify Code</button>
            </form>

            <div class="text-center mt-4">
                <p class="small text-muted mb-1">Didn't receive a code?</p>
                <form method="POST" action="{% url 'password_reset_confirm_send' %}">
                    {% csrf_token %}
                    <button type="submit" name="resend" id="resendBtn" class="btn btn-link btn-sm text-decoration-none p-0 d-none">
                        Resend New Code
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Set timer for 5 minutes (300 seconds)
        let timeRemaining = 300; 
        const timerDisplay = document.getElementById('timer');
        const verifyBtn = document.getElementById('verifyBtn');
        const resendBtn = document.getElementById('resendBtn');
        const otpInput = document.getElementById('otp_input');

        const countdown = setInterval(() => {
            let minutes = Math.floor(timeRemaining / 60);
            let seconds = timeRemaining % 60;

            // Format as 00:00
            seconds = seconds < 10 ? '0' + seconds : seconds;
            minutes = minutes < 10 ? '0' + minutes : minutes;

            timerDisplay.innerHTML = `${minutes}:${seconds}`;

            if (timeRemaining <= 0) {
                clearInterval(countdown);
                timerDisplay.innerHTML = "Expired";
                timerDisplay.classList.replace('text-danger', 'text-muted');
                
                // UX: Disable input and show Resend button
                otpInput.disabled = true;
                verifyBtn.disabled = true;
                resendBtn.classList.remove('d-none');
            }
            timeRemaining--;
        }, 1000);
    </script>

</body>
</html>
