{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Item Analysis System</title>

    <!-- Google Fonts & Bootstrap -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Link to your shared CSS -->
    <link rel="stylesheet" href="{% static 'css/login.css' %}">

    <style>
        .login-card {
            border-top: 5px solid #1d4ed8 !important;
            padding: 2.5rem;
            border-radius: 15px;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        /* Password field container for the eye icon */
        .password-field { 
            position: relative; 
        }

        .pw-eye-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #1e3a8a;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
        }

        .form-control {
            border-radius: 8px;
            padding: 12px;
            padding-right: 45px; /* Space for the eye icon */
        }
    </style>
</head>
<body>

    <div class="background-overlay"></div>

    <div class="login-wrapper">
        
        <div class="branding-section text-center mb-4">
            <img src="{% static 'images/logo.png' %}" class="school-logo" alt="Logo">
        </div>

        <div class="login-card">
            <h3 class="login-title text-center">Reset Password</h3>
            <p class="login-sub text-center mb-4">Enter your new secure password.</p>

            <!-- Error Messages (e.g., "Passwords do not match") -->
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} py-2 text-center small">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
            
            <form method="POST">
                {% csrf_token %}
                
                <!-- New Password -->
                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <div class="password-field">
                        <input type="password" name="new_password" id="id_pw1" class="form-control" placeholder="Password" required autofocus>
                        <button type="button" class="pw-eye-btn" onclick="togglePassword('id_pw1', this)">
                            <svg class="pwIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="mb-4">
                    <label class="form-label">Confirm New Password</label>
                    <div class="password-field">
                        <input type="password" name="confirm_password" id="id_pw2" class="form-control" placeholder="Re-type password" required>
                        <button type="button" class="pw-eye-btn" onclick="togglePassword('id_pw2', this)">
                            <svg class="pwIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-login w-100">Update Password</button>
            </form>
        </div>
    </div>

    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const svg = btn.querySelector('.pwIcon');
            
            if (input.type === 'password') {
                input.type = 'text';
                svg.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
            } else {
                input.type = 'password';
                svg.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            }
        }
    </script>

</body>
</html>
